# Application Configuration
spring.application.name=admin-service

# Server Configuration
server.port=8083

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/admin_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Employee Service URL
employee.service.url=http://localhost:8081

# Leave Management Service URL
leave.service.url=${LEAVE_SERVICE_URL:http://localhost:8082}